name: BookOrchestra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system TeX engine and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check & syntax warnings
        run: python -W error::SyntaxWarning -m compileall -q book_writing_cli.py frontend methods utils autoraters tests
      - name: Run unit and LaTeX integration tests
        run: python -m unittest discover -s tests -v
