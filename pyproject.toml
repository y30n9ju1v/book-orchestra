[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "book-orchestra"
version = "0.2.0"
description = "Antigravity-native multi-agent orchestration framework for authoring, illustrating, reviewing, and typesetting IT & Engineering books."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "json-repair>=0.30.0,<1.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "mistune>=3.0.0,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
    "opencv-python>=4.9.0,<5.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "PyMuPDF>=1.24.0,<2.0.0",
    "pypdf>=4.0.0,<6.0.0",
    "rich>=13.7.0,<14.0.0",
    "streamlit>=1.32.0,<2.0.0",
    "tqdm>=4.66.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["autoraters*", "frontend*", "methods*", "utils*", "workflows*"]
exclude = ["book_output*", "examples*", "templates*", "tests*"]

[tool.setuptools]
py-modules = ["book_writing_cli"]
